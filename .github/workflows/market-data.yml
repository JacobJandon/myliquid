name: Market data check

# Checks that every real price feed MyLiquid uses (src/lib/market/feeds.ts) answers from a cloud server, and that
# MyLiquid's market clock prices each day from them. A failing feed only means the simulation prices that day.

on:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main, claude/myliquid-fintech-ai-agents-1svwct]
    paths:
      [".github/workflows/market-data.yml", "scripts/market-data-check.ts", "src/lib/market/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/market-data-check.ts
