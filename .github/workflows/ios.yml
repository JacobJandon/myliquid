name: iPhone app (TestFlight)

# Builds the iPhone app (mobile/, Expo) on Expo's build servers and sends it to TestFlight. Run it by hand from the
# Actions tab once the one-time setup in mobile/README.md is done (Apple Developer account, `eas init`, EXPO_TOKEN).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check the setup
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret first (mobile/README.md, TestFlight)."
            exit 1
          fi
          if ! grep -q '"projectId"' app.json; then
            echo "::error::Run 'npx eas-cli@latest init' in mobile/ once and commit app.json (mobile/README.md, TestFlight)."
            exit 1
          fi

      - run: npm ci

      - name: Build on EAS and send to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --auto-submit
